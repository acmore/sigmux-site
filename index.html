<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sigmux — SSH terminal for iOS</title>
<style>
  :root {
    --bg: #0F0F12;
    --border: #2A2A31;
    --text: #ECECF1;
    --muted: #8E8E96;
    --accent: #FFD23F;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
  }
  main { max-width: 480px; padding: 24px; text-align: center; }
  h1 {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 32px;
    margin: 0 0 8px;
  }
  h1 .cursor { color: var(--accent); }
  p { color: var(--muted); font-size: 15px; margin: 0 0 32px; }
  a { color: var(--accent); text-decoration: none; font-size: 14px; }
  a:hover { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>sigmux<span class="cursor">▌</span></h1>
  <p>A calm, fast SSH terminal for tmux on the go.<br>Currently in private beta.</p>
  <a href="support.html">Support</a> &nbsp;·&nbsp; <a href="privacy.html">Privacy Policy</a>
</main>
</body>
</html>
